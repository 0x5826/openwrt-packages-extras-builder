name: Build OpenWrt Packages (.apk & .ipk)

on:
  workflow_dispatch:
    inputs:
      openwrt_25_ver:
        description: 'OpenWrt 25.x version (apk + ipk)'
        default: '25.12.6'
      openwrt_24_ver:
        description: 'OpenWrt 24.x version (ipk)'
        default: '24.10.8'
      openwrt_21_ver:
        description: 'OpenWrt 21.x version (ipk)'
        default: '21.02.7'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.upstream.outputs.main_sha }}
      legacy_sha: ${{ steps.upstream.outputs.legacy_sha }}
      should_build: ${{ steps.upstream.outputs.should_build }}
    steps:
      - name: Check upstream commits and latest release titles
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_SHA=$(git ls-remote https://github.com/0x5826/openwrt-packages-extras.git refs/heads/main | awk '{print substr($1,1,7)}')
          LEGACY_SHA=$(git ls-remote https://github.com/0x5826/openwrt-packages-extras.git refs/heads/openwrt-21.02 | awk '{print substr($1,1,7)}')
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "legacy_sha=$LEGACY_SHA" >> "$GITHUB_OUTPUT"

          TITLE_25=$(gh release view latest-25.12 --repo "${{ github.repository }}" --json name -q '.name' 2>/dev/null || true)
          TITLE_24=$(gh release view latest-24.10 --repo "${{ github.repository }}" --json name -q '.name' 2>/dev/null || true)
          TITLE_21=$(gh release view latest-21.02 --repo "${{ github.repository }}" --json name -q '.name' 2>/dev/null || true)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "$TITLE_25" != "OpenWrt 25.12 Packages (main:${MAIN_SHA})" ] || \
             [ "$TITLE_24" != "OpenWrt 24.10 Packages (main:${MAIN_SHA})" ] || \
             [ "$TITLE_21" != "OpenWrt 21.02 Packages (21.02:${LEGACY_SHA})" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-updates
    if: needs.check-updates.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenWrt 25.12 (APK)
          - openwrt_ver: '25.12.6'
            pkg_format: 'apk'
            feed_branch: 'main'
            target: 'x86'
            subtarget: '64'
            arch_label: 'x86_64'
            include_noarch: 'true'
            runner: 'ubuntu-latest'
          - openwrt_ver: '25.12.6'
            pkg_format: 'apk'
            feed_branch: 'main'
            target: 'armsr'
            subtarget: 'armv8'
            arch_label: 'aarch64_generic'
            include_noarch: 'false'
            runner: 'ubuntu-latest'
          - openwrt_ver: '25.12.6'
            pkg_format: 'apk'
            feed_branch: 'main'
            target: 'mediatek'
            subtarget: 'filogic'
            arch_label: 'aarch64_cortex-a53'
            include_noarch: 'false'
            runner: 'ubuntu-latest'

          # OpenWrt 25.12 (IPK)
          - openwrt_ver: '25.12.6'
            pkg_format: 'ipk'
            feed_branch: 'main'
            target: 'x86'
            subtarget: '64'
            arch_label: 'x86_64'
            include_noarch: 'true'
            runner: 'ubuntu-latest'
          - openwrt_ver: '25.12.6'
            pkg_format: 'ipk'
            feed_branch: 'main'
            target: 'armsr'
            subtarget: 'armv8'
            arch_label: 'aarch64_generic'
            include_noarch: 'false'
            runner: 'ubuntu-latest'
          - openwrt_ver: '25.12.6'
            pkg_format: 'ipk'
            feed_branch: 'main'
            target: 'mediatek'
            subtarget: 'filogic'
            arch_label: 'aarch64_cortex-a53'
            include_noarch: 'false'
            runner: 'ubuntu-latest'

          # OpenWrt 24.10 (IPK)
          - openwrt_ver: '24.10.8'
            pkg_format: 'ipk'
            feed_branch: 'main'
            target: 'x86'
            subtarget: '64'
            arch_label: 'x86_64'
            include_noarch: 'true'
            runner: 'ubuntu-latest'
          - openwrt_ver: '24.10.8'
            pkg_format: 'ipk'
            feed_branch: 'main'
            target: 'armsr'
            subtarget: 'armv8'
            arch_label: 'aarch64_generic'
            include_noarch: 'false'
            runner: 'ubuntu-latest'
          - openwrt_ver: '24.10.8'
            pkg_format: 'ipk'
            feed_branch: 'main'
            target: 'mediatek'
            subtarget: 'filogic'
            arch_label: 'aarch64_cortex-a53'
            include_noarch: 'false'
            runner: 'ubuntu-latest'

          # OpenWrt 21.02 (IPK)
          - openwrt_ver: '21.02.7'
            pkg_format: 'ipk'
            feed_branch: 'openwrt-21.02'
            target: 'x86'
            subtarget: '64'
            arch_label: 'x86_64'
            include_noarch: 'true'
            runner: 'ubuntu-24.04'
          - openwrt_ver: '21.02.7'
            pkg_format: 'ipk'
            feed_branch: 'openwrt-21.02'
            target: 'rockchip'
            subtarget: 'armv8'
            arch_label: 'aarch64_generic'
            include_noarch: 'false'
            runner: 'ubuntu-24.04'
          - openwrt_ver: '21.02.7'
            pkg_format: 'ipk'
            feed_branch: 'openwrt-21.02'
            target: 'mediatek'
            subtarget: 'mt7622'
            arch_label: 'aarch64_cortex-a53'
            include_noarch: 'false'
            runner: 'ubuntu-24.04'

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd jq curl

      - name: Download and extract OpenWrt SDK
        id: sdk
        run: |
          VER="${{ matrix.openwrt_ver }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ matrix.openwrt_ver }}" in
              25.*) VER="${{ github.event.inputs.openwrt_25_ver || matrix.openwrt_ver }}" ;;
              24.*) VER="${{ github.event.inputs.openwrt_24_ver || matrix.openwrt_ver }}" ;;
              21.*) VER="${{ github.event.inputs.openwrt_21_ver || matrix.openwrt_ver }}" ;;
            esac
          fi
          BASE_URL="https://downloads.openwrt.org/releases/${VER}/targets/${{ matrix.target }}/${{ matrix.subtarget }}"
          SDK_FILE=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 "${BASE_URL}/" | grep -oE 'openwrt-sdk-[^"<]+\.tar\.(zst|xz)' | head -n1)
          test -n "$SDK_FILE"
          echo "Downloading ${BASE_URL}/${SDK_FILE}..."
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o "${SDK_FILE}" "${BASE_URL}/${SDK_FILE}"
          mkdir -p sdk
          tar -xf "${SDK_FILE}" -C sdk --strip-components=1
          rm -f "${SDK_FILE}"
          echo "openwrt_ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "series=${VER%.*}" >> "$GITHUB_OUTPUT"

      - name: Configure and update feeds
        working-directory: sdk
        run: |
          cp feeds.conf.default feeds.conf
          echo "src-git dante_extras https://github.com/0x5826/openwrt-packages-extras.git;${{ matrix.feed_branch }}" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p dante_extras

      - name: Select packages and compile
        working-directory: sdk
        run: |
          # 解除 SDK Config-build.in 中隐藏只读开关的强绑定，避免 make defconfig 还原 =y
          if [ -f Config-build.in ]; then
            awk -v pkg_fmt="${{ matrix.pkg_format }}" '
              /^config[[:space:]]+/ { sym=$2 }
              (sym=="ALL" || sym=="ALL_KMODS" || sym=="ALL_NONSHARED" || (pkg_fmt=="ipk" && sym=="USE_APK")) && /^[[:space:]]+default[[:space:]]+y([[:space:]]|$)/ {
                sub(/default[[:space:]]+y/, "default n")
              }
              { print }
            ' Config-build.in > Config-build.in.tmp && mv Config-build.in.tmp Config-build.in
          fi

          make defconfig

          sed -i -E '/^CONFIG_ALL(_KMODS|_NONSHARED)?=y$/d' .config
          {
            echo '# CONFIG_ALL is not set'
            echo '# CONFIG_ALL_KMODS is not set'
            echo '# CONFIG_ALL_NONSHARED is not set'
          } >> .config

          if [ "${{ matrix.pkg_format }}" = "ipk" ]; then
            sed -i '/^CONFIG_USE_APK=y$/d' .config
            echo '# CONFIG_USE_APK is not set' >> .config
          fi

          awk '
            /^Source-Makefile:[[:space:]]*(package\/)?feeds\/dante_extras\// { in_feed=1; next }
            /^Source-Makefile:/ { in_feed=0; next }
            in_feed && /^Package:[[:space:]]+/ {
              pkg=$2
              if (pkg !~ /^luci-i18n-/ || pkg ~ /-zh-cn$/) {
                print "CONFIG_PACKAGE_" pkg "=m"
              }
            }
          ' tmp/.packageinfo >> .config
          make defconfig

          echo "=== Build config verification ==="
          grep -E "CONFIG_USE_APK|CONFIG_ALL" .config || true
          if [ "${{ matrix.pkg_format }}" = "ipk" ] && grep -q '^CONFIG_USE_APK=y$' .config; then
            echo "ERROR: CONFIG_USE_APK=y is still active in ipk build!"
            exit 1
          fi

          PKG_TARGETS=()
          for pkg_dir in feeds/dante_extras/*/; do
            [ -f "${pkg_dir}Makefile" ] || continue
            pkg=$(basename "$pkg_dir")
            PKG_TARGETS+=("package/feeds/dante_extras/${pkg}/compile")
          done
          echo "=== Building ${#PKG_TARGETS[@]} packages ==="
          make "${PKG_TARGETS[@]}" -j"$(nproc)" V=s

      - name: Collect built packages
        run: |
          mkdir -p dist/arch dist/noarch
          PKG_EXT="${{ matrix.pkg_format }}"

          first_apk_inspected=0
          while IFS= read -r f; do
            is_noarch=0
            case "$f" in
              */noarch/*|*_all.ipk)
                is_noarch=1
                ;;
            esac

            if [ "$is_noarch" -eq 0 ] && [ "$PKG_EXT" = "apk" ] && [ -x sdk/staging_dir/host/bin/apk ]; then
              if [ "$first_apk_inspected" -eq 0 ]; then
                echo "=== Sample apk adbdump ($f) ==="
                sdk/staging_dir/host/bin/apk adbdump "$f" 2>/dev/null | head -n 30 || true
                first_apk_inspected=1
              fi
              if sdk/staging_dir/host/bin/apk adbdump "$f" 2>/dev/null | grep -Eq '^[[:space:]]*arch:[[:space:]]*(noarch|all)$'; then
                is_noarch=1
              fi
            fi

            if [ "$is_noarch" -eq 1 ]; then
              [ "${{ matrix.include_noarch }}" = "true" ] && cp -f "$f" dist/noarch/
            else
              cp -f "$f" dist/arch/
            fi
          done < <(find sdk/bin/packages -type f -path "*/dante_extras/*.${PKG_EXT}")

          echo "=== arch packages ==="
          ls -lh dist/arch/ || true
          echo "=== noarch packages ==="
          ls -lh dist/noarch/ || true

          if [ -z "$(ls -A dist/arch)" ]; then
            echo "ERROR: No .${PKG_EXT} arch packages collected!"
            exit 1
          fi
          if [ "${{ matrix.include_noarch }}" = "true" ] && [ -z "$(ls -A dist/noarch)" ]; then
            echo "ERROR: No .${PKG_EXT} noarch packages collected!"
            exit 1
          fi

      - name: Package artifacts for upload
        run: |
          SERIES="${{ steps.sdk.outputs.series }}"
          OUT_DIR="release-assets/${SERIES}"
          mkdir -p "$OUT_DIR"
          PREFIX="openwrt-${{ steps.sdk.outputs.openwrt_ver }}-${{ matrix.feed_branch }}-${{ matrix.pkg_format }}"
          ARCH_LABEL="${{ matrix.arch_label }}"
          PKG_EXT="${{ matrix.pkg_format }}"

          tar -czf "${OUT_DIR}/${PREFIX}-${ARCH_LABEL}.tar.gz" -C dist/arch .
          for f in dist/arch/*."${PKG_EXT}"; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if [ "$PKG_EXT" = "apk" ]; then
              cp -f "$f" "${OUT_DIR}/${base%.apk}_${ARCH_LABEL}.apk"
            else
              cp -f "$f" "${OUT_DIR}/${base}"
            fi
          done

          if [ "${{ matrix.include_noarch }}" = "true" ] && [ -n "$(ls -A dist/noarch)" ]; then
            tar -czf "${OUT_DIR}/${PREFIX}-noarch.tar.gz" -C dist/noarch .
            cp -f dist/noarch/*."${PKG_EXT}" "${OUT_DIR}/"
          fi

      - name: Upload job artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkgs-${{ matrix.openwrt_ver }}-${{ matrix.feed_branch }}-${{ matrix.pkg_format }}-${{ matrix.arch_label }}
          path: release-assets/

  release:
    needs: [check-updates, build]
    if: needs.check-updates.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS and publish per-series rolling Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          cd artifacts
          for series in 25.12 24.10 21.02; do
            [ -d "$series" ] || continue
            (
              cd "$series"
              files=( *.apk *.ipk *.tar.gz )
              [ "${#files[@]}" -gt 0 ] || exit 0
              sha256sum "${files[@]}" > SHA256SUMS.txt

              TAG="latest-${series}"
              if [ "$series" = "21.02" ]; then
                TITLE="OpenWrt ${series} Packages (21.02:${{ needs.check-updates.outputs.legacy_sha }})"
                NOTES="Built from https://github.com/0x5826/openwrt-packages-extras (openwrt-21.02: ${{ needs.check-updates.outputs.legacy_sha }})."
              else
                TITLE="OpenWrt ${series} Packages (main:${{ needs.check-updates.outputs.main_sha }})"
                NOTES="Built from https://github.com/0x5826/openwrt-packages-extras (main: ${{ needs.check-updates.outputs.main_sha }})."
              fi

              gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
              gh release create "$TAG" "${files[@]}" SHA256SUMS.txt \
                --repo "${{ github.repository }}" \
                --title "$TITLE" \
                --notes "$NOTES"
            )
          done
